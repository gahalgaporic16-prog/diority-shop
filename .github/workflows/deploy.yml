name: Deploy to GitHub Pages

# Запускается автоматически при push в main, или вручную через UI GitHub
on:
  push:
    branches: [main]
  workflow_dispatch:

# Разрешения которые нужны GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Только один деплой в момент времени
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Сборка проекта
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # npm install сам генерирует зависимости из package.json
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Автоматически включает GitHub Pages если он не активирован
          # в настройках репозитория. Избавляет от ошибки
          # "Get Pages site failed" при первом запуске.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Деплой собранного на GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
